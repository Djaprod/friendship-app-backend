services:
  artii:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - artii_data:/app/server/data
    expose:
      - "8787"
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - artii
volumes:
  artii_data:
  caddy_data:
  caddy_config:
